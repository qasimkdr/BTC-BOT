name: V3 Integration Check
on:
  push:
    branches: [v3-tradingagents-integration]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check backend JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify V3 module graph imports
        run: node -e "Promise.all([import('./src/services/v3/agentRunner.js'),import('./src/services/v3/shadowOutcome.js'),import('./src/controllers/v3Controller.js'),import('./src/routes/v3Routes.js')]).then(()=>console.log('V3 imports OK'))"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
